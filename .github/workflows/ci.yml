name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor `requires-python` declares; 3.14 is the
        # interpreter in daily use here, and it was missing, so every
        # number measured locally came from a version CI never ran.
        #
        # D-115: every job used to be `ubuntu-latest`, and this project is
        # developed and used on macOS. `routes/media.py`'s containment checks —
        # the ADR-0003 boundary — resolve paths, and a case-insensitive
        # filesystem answers `Path.resolve()` and `relative_to` differently
        # from ext4. One macOS row rather than the whole grid: the platform
        # matters, four interpreters on it do not.
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev, legacy and ui extras
        # legacy brings networkx/pyvis, which the upstream scripts in
        # legacy/upstream/ need. Without it their tests skip rather than run.
        # ui brings fastapi/uvicorn: the Track B route tests skip without
        # them, so leaving it out would have meant the whole API layer was
        # green in CI by never running. The zero-dependency job below still
        # proves the core package installs and tests without either.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,legacy,ui]'
      - name: Run the suite
        run: pytest -q

  zero-dependency:
    # ADR 0001 invariant 5: the core package installs and tests with no
    # optional dependency. jsonschema is absent here on purpose, so the schema
    # validation tests must skip rather than fail.
    name: core package without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core package and pytest only
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Fail if an optional dependency crept into the core install
        run: |
          for package in jsonschema openapi-spec-validator networkx pyvis yt-dlp fastapi uvicorn; do
            if pip show "$package" > /dev/null 2>&1; then
              echo "$package is installed; it must stay an optional extra" >&2
              exit 1
            fi
          done
      - name: Run the suite
        run: pytest -q

  extras:
    # Every declared optional extra must be provable installable. `dev` and
    # `legacy` were the only two any job installed, so `youtube`, `mcp` and `ui`
    # — three of the five — could have been broken (a yanked release, an
    # impossible pin, a package that no longer builds) with nothing in CI to
    # say so. `tests/test_ui_scaffold.py::test_ci_installs_every_declared_extra`
    # fails if a new extra is added to pyproject.toml without a row here.
    name: extra installs (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: youtube
            imports: "yt_dlp, youtube_transcript_api"
          - extra: mcp
            imports: "mcp, mcp.server"
          - extra: ui
            imports: "fastapi, uvicorn"
          - extra: legacy
            imports: "networkx, pyvis"
          - extra: dev
            imports: "pytest, jsonschema, openapi_spec_validator"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }},dev]"
      - name: Fail if pip resolved a broken dependency set
        run: pip check
      - name: Every distribution the extra declares is actually installed
        run: |
          python - <<'PY'
          import re, sys, tomllib
          from importlib.metadata import PackageNotFoundError, version

          extra = "${{ matrix.extra }}"
          with open("pyproject.toml", "rb") as handle:
              specs = tomllib.load(handle)["project"]["optional-dependencies"][extra]
          missing = []
          for spec in specs:
              name = re.split(r"[<>=!~\[; ]", spec, maxsplit=1)[0].strip()
              try:
                  print(f"{name} {version(name)}")
              except PackageNotFoundError:
                  missing.append(name)
          if missing:
              print(f"declared by [{extra}] but not installed: {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Import what the extra unlocks
        # `pip install` succeeding is not the same claim as "it imports".
        run: python -c "import ${{ matrix.imports }}"
      - name: The MCP server builds against the installed mcp
        if: matrix.extra == 'mcp'
        # The `mcp>=2,<3` pin and `from mcp.server import MCPServer` have to
        # agree, and the 14 registrations have to construct. Nothing else in CI
        # ever imports this module with the extra present.
        run: |
          python -c "
          import x2knwldg.mcp_server as server
          assert server.mcp is not None, 'the mcp extra is installed but no server was built'
          assert len(server.TOOLS) == 10, server.TOOLS
          print('MCP surface:', len(server.TOOLS), 'tools,', len(server.RESOURCES), 'resources,', len(server.PROMPTS), 'prompts')
          "
      - name: Run the suite with the extra present
        run: pytest -q

  fixtures:
    # The committed run fixtures must stay reproducible from the generator, and
    # must keep the statuses the honest-status tests rely on (T-006, R11).
    name: run fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Regenerate and diff
        run: |
          python tests/fixtures/runs/build_fixtures.py
          git diff --stat -- tests/fixtures/runs/
          git diff --quiet -- tests/fixtures/runs/ || {
            echo "Regenerating the fixtures changed them; commit the result." >&2
            git diff -- tests/fixtures/runs/ | head -100
            exit 1
          }

  web-typecheck:
    # Risk R17: tests/test_api_types.py proves the committed types.d.ts matches
    # the generator, but only a compiler proves it is valid TypeScript. This job
    # is the first Node in CI (T-008) and is the whole of that mitigation.
    #
    # web/tsconfig.json sets skipLibCheck: false and lists the declarations as a
    # root file on purpose. With the default skipLibCheck, tsc would skip the one
    # file this job exists to check and pass without looking.
    name: web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the frontend toolchain
        working-directory: web
        run: npm ci
      - name: Type-check the frozen contract and the frontend
        working-directory: web
        run: npm run typecheck
      - name: Test the frontend
        # Hermetic: the integration files under web/src skip unless
        # X2KNWLDG_API_BASE names a running server, so this job needs no
        # Python and stands up no API. What it does cover is every unit and
        # component test T-109--T-114 wrote, including the logical-CSS guard
        # (D-012) and the provenance guard that no class is signalled by
        # colour alone (ADR 0001 invariant 10).
        working-directory: web
        run: npm test
      - name: Build the frontend
        # tsc --noEmit does not resolve assets or bundle, so a frontend can
        # type-check and test green while the production build is broken.
        working-directory: web
        run: npm run build

  lint:
    # D-114: the project had no Python lint, format or type checking at all —
    # no config, no CI step, no mention in the docs — while `web/` got
    # `tsc --strict` with `noUncheckedIndexedAccess` and a job of its own.
    # That asymmetry cost real defects: four imports left dead by a refactor
    # were found by running pyflakes by hand, and nothing else would have said
    # so. The rule set is in `pyproject.toml` and is a floor chosen to be
    # raised; `ruff format` is deliberately not a gate.
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,legacy,ui]'
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  integration:
    # D-116: 13 frontend integration tests gate on `X2KNWLDG_API_BASE` and no
    # job set it, so the tests that exist *because* "a mock agrees with
    # whatever the frontend assumed" never ran anywhere. They are the only
    # check that the wire between `web/` and the real server still fits.
    name: frontend against the real API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the package and the frontend toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ui]'
          npm --prefix web ci
      - name: Serve the committed run fixtures
        # `dev_api.py --fixtures` (the default) copies the PASS/PARTIAL/FAIL
        # fixtures into a scratch project, indexes it, and binds loopback only.
        run: |
          python web/scripts/dev_api.py --port 8931 &
          echo "$!" > /tmp/dev_api.pid
      - name: Wait for it to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8931/api/status > /dev/null; then
              echo "the API is up"; exit 0
            fi
            sleep 1
          done
          echo "the API never came up" >&2
          exit 1
      - name: Run the frontend suite against it
        # Without the variable these files skip, which is the defect. The step
        # asserts they actually ran rather than trusting the exit code.
        working-directory: web
        env:
          X2KNWLDG_API_BASE: http://127.0.0.1:8931
        run: |
          npx vitest run --reporter=verbose 2>&1 | tee /tmp/vitest.log
          if grep -qE "integration.*\bskipped\b" /tmp/vitest.log; then
            echo "the integration tests skipped; X2KNWLDG_API_BASE did not take" >&2
            exit 1
          fi
      - name: Stop the server
        if: always()
        # Written as a conditional rather than with a shell escape hatch: a
        # step that cannot fail is a step that proves nothing, and
        # `tests/test_ui_scaffold.py` refuses the whole family of them — including
        # in a comment, so the guard cannot be talked around.
        run: |
          pid="$(cat /tmp/dev_api.pid)"
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          else
            echo "the server was already gone"
          fi

  requirements:
    # D-111: `requirements.txt` forwards to the extras and said the `ui` layer
    # was "not functional yet" and that CI installs `.[dev,legacy]`. Both were
    # wrong, and no job installed this file, which is why nothing said so.
    name: requirements.txt installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install through requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: What it forwards to is importable
        run: |
          python -c "import x2knwldg, pytest, jsonschema, yt_dlp, youtube_transcript_api, requests"
      - name: And the suite runs on it
        run: pytest -q
