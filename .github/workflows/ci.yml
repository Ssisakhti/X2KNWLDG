name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev and legacy extras
        # legacy brings networkx/pyvis, which the upstream scripts in
        # legacy/upstream/ need. Without it their tests skip rather than run.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,legacy]'
      - name: Run the suite
        run: pytest -q

  zero-dependency:
    # ADR 0001 invariant 5: the core package installs and tests with no
    # optional dependency. jsonschema is absent here on purpose, so the schema
    # validation tests must skip rather than fail.
    name: core package without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the core package and pytest only
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Fail if an optional dependency crept into the core install
        run: |
          for package in jsonschema openapi-spec-validator networkx pyvis yt-dlp fastapi uvicorn; do
            if pip show "$package" > /dev/null 2>&1; then
              echo "$package is installed; it must stay an optional extra" >&2
              exit 1
            fi
          done
      - name: Run the suite
        run: pytest -q

  fixtures:
    # The committed run fixtures must stay reproducible from the generator, and
    # must keep the statuses the honest-status tests rely on (T-006, R11).
    name: run fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Regenerate and diff
        run: |
          python tests/fixtures/runs/build_fixtures.py
          git diff --stat -- tests/fixtures/runs/
          git diff --quiet -- tests/fixtures/runs/ || {
            echo "Regenerating the fixtures changed them; commit the result." >&2
            git diff -- tests/fixtures/runs/ | head -100
            exit 1
          }

  web-typecheck:
    # Risk R17: tests/test_api_types.py proves the committed types.d.ts matches
    # the generator, but only a compiler proves it is valid TypeScript. This job
    # is the first Node in CI (T-008) and is the whole of that mitigation.
    #
    # web/tsconfig.json sets skipLibCheck: false and lists the declarations as a
    # root file on purpose. With the default skipLibCheck, tsc would skip the one
    # file this job exists to check and pass without looking.
    name: web typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the frontend toolchain
        working-directory: web
        run: npm ci
      - name: Type-check the frozen contract and the frontend
        working-directory: web
        run: npm run typecheck
