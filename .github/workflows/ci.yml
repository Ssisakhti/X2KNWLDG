name: CI

#
# Every `uses:` is pinned to a commit SHA with the version it is, in a comment
# beside it (D-203). A mutable major tag — `actions/checkout@v4` — is a
# *reference the upstream owner can move*, and a workflow that trusts one runs
# whatever that owner points it at next, with this repository's checkout and its
# token in scope. The tags themselves are still recorded, because a SHA nobody
# can read is a pin nobody will ever update; the comment is what makes a bump
# reviewable. This is the same reasoning D-117 gives for pinning the renderer
# to an exact version rather than a range, applied to the supply chain that
# builds the thing.
#
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor `requires-python` declares; 3.14 is the
        # interpreter in daily use here, and it was missing, so every
        # number measured locally came from a version CI never ran.
        #
        # D-115: every job used to be `ubuntu-latest`, and this project is
        # developed and used on macOS. `routes/media.py`'s containment checks —
        # the ADR-0003 boundary — resolve paths, and a case-insensitive
        # filesystem answers `Path.resolve()` and `relative_to` differently
        # from ext4. One macOS row rather than the whole grid: the platform
        # matters, four interpreters on it do not.
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: macos-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev, legacy and ui extras
        # legacy brings networkx/pyvis, which the upstream scripts in
        # legacy/upstream/ need. Without it their tests skip rather than run.
        # ui brings fastapi/uvicorn: the Track B route tests skip without
        # them, so leaving it out would have meant the whole API layer was
        # green in CI by never running. The zero-dependency job below still
        # proves the core package installs and tests without either.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,legacy,ui]'
      - name: Run the suite
        run: pytest -q

  zero-dependency:
    # ADR 0001 invariant 5: the core package installs and tests with no
    # optional dependency. jsonschema is absent here on purpose, so the schema
    # validation tests must skip rather than fail.
    name: core package without extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the core package and pytest only
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Fail if an optional dependency crept into the core install
        # The list is derived from pyproject.toml rather than restated here.
        # A hand-maintained list named seven of the fourteen declared optional
        # distributions, so `mcp`, `youtube-transcript-api` and `requests`
        # could have crept in with nothing to say so. `pytest` is exempt: this
        # job installs it on purpose, because it is what runs the suite.
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              project = tomllib.load(handle)["project"]

          INSTALLED_ON_PURPOSE = {"pytest"}
          names = set()
          for requirements in project["optional-dependencies"].values():
              for requirement in requirements:
                  name = requirement.split(";")[0].strip()
                  for separator in ("[", "=", "<", ">", "!", "~", " "):
                      name = name.split(separator)[0]
                  name = name.strip()
                  if name and name not in INSTALLED_ON_PURPOSE:
                      names.add(name)

          print(f"checking {len(names)} declared optional distributions")
          leaked = [
              name
              for name in sorted(names)
              if subprocess.run(
                  ["pip", "show", name], capture_output=True
              ).returncode == 0
          ]
          if leaked:
              print(
                  f"{', '.join(leaked)} installed; each must stay an optional extra",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: Run the suite
        run: pytest -q

  extras:
    # Every declared optional extra must be provable installable. `dev` and
    # `legacy` were the only two any job installed, so `youtube`, `mcp` and `ui`
    # — three of the five — could have been broken (a yanked release, an
    # impossible pin, a package that no longer builds) with nothing in CI to
    # say so. `tests/test_ui_scaffold.py::test_ci_installs_every_declared_extra`
    # fails if a new extra is added to pyproject.toml without a row here.
    name: extra installs (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: youtube
            imports: "yt_dlp, youtube_transcript_api"
          - extra: mcp
            imports: "mcp, mcp.server"
          - extra: ui
            imports: "fastapi, uvicorn"
          - extra: legacy
            imports: "networkx, pyvis"
          - extra: dev
            imports: "pytest, jsonschema, openapi_spec_validator"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install the extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[${{ matrix.extra }},dev]"
      - name: Fail if pip resolved a broken dependency set
        run: pip check
      - name: Every distribution the extra declares is actually installed
        run: |
          python - <<'PY'
          import re, sys, tomllib
          from importlib.metadata import PackageNotFoundError, version

          extra = "${{ matrix.extra }}"
          with open("pyproject.toml", "rb") as handle:
              specs = tomllib.load(handle)["project"]["optional-dependencies"][extra]
          missing = []
          for spec in specs:
              name = re.split(r"[<>=!~\[; ]", spec, maxsplit=1)[0].strip()
              try:
                  print(f"{name} {version(name)}")
              except PackageNotFoundError:
                  missing.append(name)
          if missing:
              print(f"declared by [{extra}] but not installed: {', '.join(missing)}", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Import what the extra unlocks
        # `pip install` succeeding is not the same claim as "it imports".
        run: python -c "import ${{ matrix.imports }}"
      - name: The MCP server builds against the installed mcp
        if: matrix.extra == 'mcp'
        # The `mcp>=2,<3` pin and `from mcp.server import MCPServer` have to
        # agree, and the 14 registrations have to construct. Nothing else in CI
        # ever imports this module with the extra present.
        run: |
          python -c "
          import x2knwldg.mcp_server as server
          assert server.mcp is not None, 'the mcp extra is installed but no server was built'
          assert len(server.TOOLS) == 10, server.TOOLS
          print('MCP surface:', len(server.TOOLS), 'tools,', len(server.RESOURCES), 'resources,', len(server.PROMPTS), 'prompts')
          "
      - name: Run the suite with the extra present
        run: pytest -q

  fixtures:
    # The committed run fixtures must stay reproducible from the generator, and
    # must keep the statuses the honest-status tests rely on (T-006, R11).
    name: run fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Regenerate and diff
        # `git status --porcelain`, not `git diff`: a generator that starts
        # writing an extra artifact leaves it *untracked*, and `git diff` is
        # blind to that, so the check passed while the fixtures had changed.
        #
        # All four builders, because all four make the same promise and only
        # one of them was ever checked here: the capture fixtures (T-223) and
        # the Twitter run fixtures (T-227) are regenerated from committed bytes
        # exactly as the YouTube runs are, and §7.2 of docs/PROJECT_MANAGEMENT.md
        # already listed them as the regression baseline. The Source Map
        # contract fixtures (T-251) joined them: they take their unit ids and
        # their input digests from the committed runs, so they drift the moment
        # a run does — which is precisely what they exist to notice.
        run: |
          set -e
          for builder in \
            tests/fixtures/runs/build_fixtures.py \
            tests/fixtures/captures/build_captures.py \
            tests/fixtures/twitter-runs/build_fixtures.py \
            tests/fixtures/source-map/build_fixtures.py
          do
            directory="$(dirname "$builder")/"
            python "$builder"
            git status --porcelain -- "$directory"
            if [ -n "$(git status --porcelain -- "$directory")" ]; then
              echo "Regenerating $directory changed it; commit the result." >&2
              git diff -- "$directory" | head -100
              exit 1
            fi
          done

  web-typecheck:
    # Risk R17: tests/test_api_types.py proves the committed types.d.ts matches
    # the generator, but only a compiler proves it is valid TypeScript. This job
    # is the first Node in CI (T-008) and is the whole of that mitigation.
    #
    # web/tsconfig.json sets skipLibCheck: false and lists the declarations as a
    # root file on purpose. With the default skipLibCheck, tsc would skip the one
    # file this job exists to check and pass without looking.
    # The name is a *contract with branch protection*, not a description: the
    # `main is gated by CI` ruleset requires a check called exactly
    # `web (typecheck, test, build)`, so renaming this job silently removes a
    # required gate — the check it names stops reporting and the pull request
    # blocks for ever with every job green. D-203 did precisely that when it
    # added the lint step, and the ruleset caught it. Add steps here freely;
    # change this line only together with the ruleset.
    name: web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the frontend toolchain
        working-directory: web
        run: npm ci
      - name: Lint the frontend
        # D-203: there was no ESLint anywhere — no config, no dependency, no
        # script, no CI step — and nine
        # `// eslint-disable-next-line react-hooks/exhaustive-deps` comments
        # across `web/src`. Every one of those suppressed nothing, and the rule
        # they name is the one rule this code repeatedly needed to silence,
        # which makes it the last one that should have been unchecked. The
        # asymmetry the `lint` job below fixed for Python (D-114), fixed on the
        # other half of the repository. Narrow on purpose: `web/eslint.config.js`
        # says what it does and does not check, and why.
        working-directory: web
        run: npm run lint
      - name: Type-check the frozen contract and the frontend
        working-directory: web
        run: npm run typecheck
      - name: Type-check the browser gate
        # Playwright transpiles specs without type-checking them, so without
        # this the `T-209` gate would go unchecked. Its own program, because it
        # needs `skipLibCheck` for declarations this project does not own;
        # `src` keeps it off (R17). This program also carries `vite.config.ts`,
        # which belonged to neither program and owns the `/api` proxy the
        # `integration` and `browser` jobs both depend on.
        working-directory: web
        run: npm run typecheck:browser
      - name: Type-check the capture and measurement scripts
        # D-203: five `.ts` files under `web/scripts/` were in neither program,
        # so the code that produces the acceptance captures and the
        # measurements `SPEC.md` quotes was type-checked by nothing — the exact
        # defect D-156 fixed for `vite.config.ts`, reopened by the files added
        # after it. `capture_mockups.ts` imports the browser gate's shared
        # measurement, so a signature change there broke it silently. Its own
        # program because these are Node scripts and need ambient Node types;
        # `src` keeps `types: []` with `skipLibCheck: false` (R17).
        working-directory: web
        run: npm run typecheck:scripts
      - name: Test the frontend
        # Hermetic: the integration files under web/src skip unless
        # X2KNWLDG_API_BASE names a running server, so this job needs no
        # Python and stands up no API. What it does cover is every unit and
        # component test T-109--T-114 wrote, including the logical-CSS guard
        # (D-012) and the provenance guard that no class is signalled by
        # colour alone (ADR 0001 invariant 10).
        working-directory: web
        run: npm test
      - name: Build the frontend
        # tsc --noEmit does not resolve assets or bundle, so a frontend can
        # type-check and test green while the production build is broken.
        working-directory: web
        run: npm run build

  lint:
    # D-114: the project had no Python lint, format or type checking at all —
    # no config, no CI step, no mention in the docs — while `web/` got
    # `tsc --strict` with `noUncheckedIndexedAccess` and a job of its own.
    # That asymmetry cost real defects: four imports left dead by a refactor
    # were found by running pyflakes by hand, and nothing else would have said
    # so. The rule set is in `pyproject.toml` and is a floor chosen to be
    # raised; `ruff format` is deliberately not a gate.
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install with dev extras
        # `mcp` is here because `mypy` checks `src/x2knwldg/mcp_server.py`.
        # Without it the import is unresolved, `ignore_missing_imports` makes
        # `MCPServer` `Any`, and the one module that fails the check is the one
        # module the check cannot see.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,legacy,ui,mcp]'
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy

  integration:
    # D-116: 13 frontend integration tests gate on `X2KNWLDG_API_BASE` and no
    # job set it, so the tests that exist *because* "a mock agrees with
    # whatever the frontend assumed" never ran anywhere. They are the only
    # check that the wire between `web/` and the real server still fits.
    name: frontend against the real API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the package and the frontend toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ui]'
          npm --prefix web ci
      - name: Serve the committed run fixtures
        # `dev_api.py --fixtures` (the default) copies the PASS/PARTIAL/FAIL
        # fixtures into a scratch project, indexes it, and binds loopback only.
        run: |
          python web/scripts/dev_api.py --port 8931 &
          echo "$!" > /tmp/dev_api.pid
      - name: Wait for it to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8931/api/status > /dev/null; then
              echo "the API is up"; exit 0
            fi
            sleep 1
          done
          echo "the API never came up" >&2
          exit 1
      - name: Run the frontend suite against it
        # Without the variable these files skip, which is the defect. The step
        # asserts they actually ran rather than trusting the exit code.
        working-directory: web
        env:
          X2KNWLDG_API_BASE: http://127.0.0.1:8931
        run: |
          # `pipefail` first, and it is load-bearing: Actions runs `bash -e`
          # without it, so `vitest | tee` exits with tee's status and this step
          # would have gone green on a red frontend suite.
          set -o pipefail
          npx vitest run --reporter=verbose 2>&1 | tee /tmp/vitest.log
          # And the skip check. Vitest marks a skipped test with a glyph and
          # never the word "skipped" on the line, so grepping the test lines
          # could not fire — a guard that never matches proves nothing, which
          # is the failure this whole job exists to prevent. The summary is the
          # discriminator: with the API up, nothing skips at all, so a skip
          # count anywhere in the log means the variable did not take.
          if grep -qE "[0-9]+ skipped" /tmp/vitest.log; then
            echo "something skipped, so X2KNWLDG_API_BASE did not take:" >&2
            grep -E "Test Files|Tests " /tmp/vitest.log >&2
            exit 1
          fi
      - name: Stop the server
        if: always()
        # Written as a conditional rather than with a shell escape hatch: a
        # step that cannot fail is a step that proves nothing, and
        # `tests/test_ui_scaffold.py` refuses the whole family of them — including
        # in a comment, so the guard cannot be talked around.
        run: |
          pid="$(cat /tmp/dev_api.pid)"
          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
          else
            echo "the server was already gone"
          fi

  browser:
    # `T-209`: the Map in a real browser, which is the one witness the other
    # jobs cannot be. jsdom has no WebGL and no layout, so the renderer's
    # lifecycle, the reduced-motion camera, the 44 px touch targets, the
    # narrow-screen stage and the keyboard's own tab order are all asserted
    # here or nowhere -- and counting WebGL contexts is how ADR 0005
    # invariant 10 stops being an assumption.
    #
    # Against the committed run fixtures, like the integration job: `output/`
    # is not in the repository, so the real 86-node library exists only on a
    # developer's machine. The recorded walk in ADR 0005 was performed there;
    # this job is the regression net.
    name: the Map in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the package and the frontend toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,ui]'
          npm --prefix web ci
      - name: Install the browser the gate is recorded on
        # Google Chrome, the same channel the walk was recorded in, rather
        # than the bundled Chromium: the gate has been run on both and passes
        # on both -- the bundled one answers WebGL2 through a software
        # rasteriser, which is a useful second witness -- but a result should
        # name one browser, and this is the one ADR 0005 names.
        working-directory: web
        run: npx playwright install --with-deps chrome
      - name: Walk it
        working-directory: web
        env:
          # `dev_api.py`'s default is the committed fixtures, and the config
          # starts both servers itself.
          X2KNWLDG_PYTHON: python
        run: npm run browser
      - name: Keep what a failure left behind
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-gate-trace
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  requirements:
    # D-111: `requirements.txt` forwards to the extras and said the `ui` layer
    # was "not functional yet" and that CI installs `.[dev,legacy]`. Both were
    # wrong, and no job installed this file, which is why nothing said so.
    name: requirements.txt installs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install through requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: What it forwards to is importable
        run: |
          python -c "import x2knwldg, pytest, jsonschema, yt_dlp, youtube_transcript_api, requests"
      - name: And the suite runs on it
        run: pytest -q
